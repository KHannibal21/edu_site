{% extends 'apps/base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Просмотр данных</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <span class="badge bg-primary">{{ courses|length }} курсов</span>
            <span class="badge bg-success">{{ lessons|length }} уроков</span>
            <span class="badge bg-warning">{{ items|length }} заданий</span>
            <span class="badge bg-info">{{ users|length }} пользователей</span>
        </div>
    </div>
</div>

<!-- Кнопки входа/регистрации -->
<div class="mb-4">
    <button class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#loginModal">
        Вход
    </button>
    <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#registerModal">
        Регистрация
    </button>
</div>

<!-- Фильтры -->
<div class="card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Сложность:</label>
                <select name="difficulty" class="form-select">
                    <option value="">Все уровни</option>
                    {% for i in "12345" %}
                    <option value="{{ i }}" {% if difficulty_filter == i %}selected{% endif %}>Уровень {{ i }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Тип задания:</label>
                <select name="type" class="form-select">
                    <option value="">Все типы</option>
                    <option value="mcq/single" {% if type_filter == "mcq/single" %}selected{% endif %}>MCQ Single</option>
                    <option value="mcq/multi" {% if type_filter == "mcq/multi" %}selected{% endif %}>MCQ Multi</option>
                    <option value="short" {% if type_filter == "short" %}selected{% endif %}>Short Answer</option>
                    <option value="numeric" {% if type_filter == "numeric" %}selected{% endif %}>Numeric</option>
                </select>
            </div>
            <div class="col-md-6 align-self-end">
                <button type="submit" class="btn btn-primary me-2">
                    <i class="fas fa-filter"></i> Применить фильтры
                </button>
                <a href="{% url 'apps:data' %}" class="btn btn-outline-secondary">
                    <i class="fas fa-times"></i> Сбросить
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Тут идёт остальной контент страницы: Курсы, Пользователи, Задания -->
<!-- ... (оставляем без изменений) ... -->

<!-- Модальное окно: Вход -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'apps:login' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Вход</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="loginUsername" class="form-label">Имя пользователя</label>
            <input type="text" class="form-control" id="loginUsername" name="username" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="loginPassword" name="password" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Войти</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Модальное окно: Регистрация -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'apps:register' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="registerModalLabel">Регистрация</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="regUsername" class="form-label">Имя пользователя</label>
            <input type="text" class="form-control" id="regUsername" name="username" required>
          </div>
          <div class="mb-3">
            <label for="regEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="regEmail" name="email" required>
          </div>
          <div class="mb-3">
            <label for="regPassword1" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="regPassword1" name="password1" required>
          </div>
          <div class="mb-3">
            <label for="regPassword2" class="form-label">Повторите пароль</label>
            <input type="password" class="form-control" id="regPassword2" name="password2" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Зарегистрироваться</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
